<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ad Account Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0f14; --surface:#151a22; --surface-2:#1b212b; --surface-3:#20283380;
    --border:#293040; --text:#e7ebf1; --muted:#8b93a3; --muted-2:#5c6373;
    --accent:#33d6a6; --accent-dim:rgba(51,214,166,.14);
    --high:#ef5a6f; --high-dim:rgba(239,90,111,.14);
    --med:#f2a93c; --med-dim:rgba(242,169,60,.14);
    --low:#33d6a6; --low-dim:rgba(51,214,166,.14);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border); padding:20px 12px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ font-size:15px; font-weight:800; padding:0 8px 18px; letter-spacing:-0.01em; }
  .brand span{ color:var(--accent); }
  .nav-section-label{ font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.05em; padding:10px 8px 6px; font-weight:700; }
  .nav-item{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px;
    cursor:pointer; font-size:13.5px; font-weight:600; color:var(--muted); margin-bottom:2px;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--text); }
  .nav-item.active{ background:var(--accent-dim); color:var(--accent); }
  .nav-item .count{ margin-left:auto; font-size:11px; color:var(--muted-2); font-weight:600; }
  .nav-item.active .count{ color:var(--accent); }

  .main{ flex:1; padding:28px 32px 80px; max-width:1500px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap; }
  .page-head h1{ font-size:24px; font-weight:800; margin:0 0 4px; letter-spacing:-0.01em; }
  .page-head p{ margin:0; color:var(--muted); font-size:13.5px; }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:9px 14px; min-width:78px; }
  .stat .num{ font-size:18px; font-weight:700; line-height:1.1; }
  .stat .lbl{ font-size:10.5px; color:var(--muted); margin-top:2px; }

  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--text);
    font-family:inherit; font-size:13px; font-weight:600; padding:8px 13px; border-radius:8px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.15s;
  }
  .btn:hover{ border-color:#3a4356; background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#08130f; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger:hover{ border-color:var(--high); color:var(--high); }
  .btn.sm{ padding:5px 10px; font-size:12px; }

  #accountsWrap{ display:grid; grid-template-columns:repeat(auto-fit, minmax(500px, 1fr)); gap:18px; align-items:start; }
  .acct-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .acct-head{ display:flex; align-items:center; gap:10px; padding:13px 16px; background:var(--surface-2); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .acct-name-input{ background:transparent; border:none; color:var(--text); font-size:15px; font-weight:700; font-family:inherit; padding:4px 6px; border-radius:6px; min-width:160px; flex:1; }
  .acct-name-input:hover, .acct-name-input:focus{ background:var(--surface); outline:1px solid var(--border); }
  .pill{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600; }
  .pill.pri-High{ background:var(--high-dim); color:var(--high); }
  .pill.pri-Medium{ background:var(--med-dim); color:var(--med); }
  .pill.pri-Low{ background:var(--low-dim); color:var(--low); }
  .pill.pri-{ background:var(--surface-3); color:var(--muted); }

  .acct-body{ padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:900px){ .acct-body{ grid-template-columns:1fr; } }

  .section-label{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 10px; display:flex; align-items:center; gap:6px; }
  .section-label:first-child{ margin-top:0; }
  .field-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; color:var(--muted-2); font-weight:600; }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit;
    font-size:13px; padding:8px 10px; border-radius:8px; width:100%; resize:vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); }
  .field textarea{ min-height:36px; }
  .token-row{ display:flex; gap:6px; }
  .token-row input{ flex:1; }

  /* Fixed 3-column pages block */
  .pages3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  @media (max-width:700px){ .pages3{ grid-template-columns:1fr; } }
  .page-col{ background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .page-col .pc-title{ font-size:11.5px; font-weight:700; color:var(--text); }
  .page-col input{ background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:12.5px; padding:7px 8px; border-radius:7px; width:100%; }
  .page-col input:focus{ outline:none; border-color:var(--accent); }

  .status-badge{ font-size:11px; font-weight:700; padding:5px 8px; border-radius:20px; border:none; cursor:pointer; align-self:flex-start; }
  .status-Active{ background:var(--accent-dim); color:var(--accent); }
  .status-Inactive{ background:var(--surface-3); color:var(--muted); }

  .extra-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .extra-table th{ text-align:left; font-size:10.5px; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); }
  .extra-table td{ padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .extra-table input{ width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:12.5px; padding:6px 8px; border-radius:7px; }
  .extra-table input:focus{ outline:none; border-color:var(--accent); }

  .events-table{ width:100%; border-collapse:collapse; }
  .events-table td{ padding:7px 8px; border-bottom:1px solid var(--border); font-size:13px; }
  .events-table tr:last-child td{ border-bottom:none; }
  .events-table td:first-child{ font-weight:600; }
  .events-table td:last-child{ text-align:right; }

  .icon-btn{ background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer; font-size:12.5px; padding:5px 9px; border-radius:7px; font-family:inherit; font-weight:600; }
  .icon-btn:hover{ color:var(--text); border-color:var(--border); background:var(--surface); }
  .icon-btn.del:hover{ color:var(--high); }

  .add-acct-btn{ width:100%; background:var(--surface); border:1px dashed var(--border); color:var(--muted); font-family:inherit; font-size:13.5px; font-weight:600; padding:14px; border-radius:12px; cursor:pointer; margin-top:4px; }
  .add-acct-btn:hover{ color:var(--accent); border-color:var(--accent); }

  .toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }

  table.lp-table, table.dash-table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  table.lp-table th, table.dash-table th{ text-align:left; font-size:11px; color:var(--muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
  table.lp-table td, table.dash-table td{ padding:8px 10px; border-bottom:1px solid var(--border); font-size:12.5px; vertical-align:middle; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.lp-table tr:last-child td, table.dash-table tr:last-child td{ border-bottom:none; }
  .table-scroll{ overflow-x:auto; border-radius:var(--radius); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; width:360px; }
  .modal h3{ margin:0 0 14px; font-size:15px; }
  .modal .field{ margin-bottom:12px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }

  .mask-cell{ display:flex; align-items:center; gap:6px; }

  footer{ text-align:center; color:var(--muted-2); font-size:12px; margin-top:40px; }
</style>
</head>

<script>
const STORAGE_KEY = 'ad-account-manager-v2';
const EVENT_NAMES = ['Page View','Leads','Scheduled','Add to Cart','Initiate Checkout','Purchase'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function mkPageField(url, status){ return { url: url || '', status: status || 'Inactive' }; }

function mkAccount(o){
  o = o || {};
  const events = EVENT_NAMES.map(name => {
    const existing = (o.events || []).find(e => e.name === name);
    return { name, status: existing ? existing.status : 'Inactive' };
  });
  return {
    id: uid(),
    name: o.name || '',
    acctId: o.acctId || '',
    pixelId: o.pixelId || '',
    accessToken: o.accessToken || '',
    audienceExclusion: o.audienceExclusion || '',
    videoAds: o.videoAds || '',
    imageAds: o.imageAds || '',
    adsFromClient: o.adsFromClient || '',
    webinarPage: mkPageField(o.webinarPage && o.webinarPage.url, o.webinarPage && o.webinarPage.status),
    webinarThankYou: mkPageField(o.webinarThankYou && o.webinarThankYou.url, o.webinarThankYou && o.webinarThankYou.status),
    silverThankYou: mkPageField(o.silverThankYou && o.silverThankYou.url, o.silverThankYou && o.silverThankYou.status),
    extraPages: (o.extraPages || []).map(p => ({ id: uid(), type: p.type||'', page: p.page||'', thankYou: p.thankYou||'', status: p.status||'Inactive' })),
    events,
    tracking: {
      priority: (o.tracking && o.tracking.priority) || '',
      checked: (o.tracking && o.tracking.checked) || 'No',
      dateChecked: (o.tracking && o.tracking.dateChecked) || '',
      optimization: (o.tracking && o.tracking.optimization) || '',
      status: (o.tracking && o.tracking.status) || 'Active - Stable',
      update: (o.tracking && o.tracking.update) || '',
      remarks: (o.tracking && o.tracking.remarks) || ''
    }
  };
}

function migrate(parsed){
  // upgrade older data shape (v1 "pages" array) to v2 fixed fields, if needed
  return parsed.map(client => ({
    ...client,
    accounts: client.accounts.map(a => {
      if(a.webinarPage) return mkAccount(a); // already v2-ish, just normalize via mkAccount
      const pages = a.pages || [];
      const webinar = pages.find(p => p.type === 'Webinar');
      const silver = pages.find(p => p.type === 'Silver');
      const extras = pages.filter(p => p.type !== 'Webinar' && p.type !== 'Silver');
      return mkAccount({
        ...a,
        webinarPage: webinar ? { url: webinar.page, status: webinar.status } : undefined,
        webinarThankYou: webinar ? { url: webinar.thankYou, status: webinar.status } : undefined,
        silverThankYou: silver ? { url: silver.thankYou, status: silver.status } : undefined,
        extraPages: extras
      });
    })
  }));
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || !parsed.length) return defaultData();
    return migrate(parsed);
  }catch(e){ return defaultData(); }
}

let data = load();
let currentView = data[0] ? data[0].id : 'dashboard';
let addPageModal = null; // {clientId, accountId} while modal open

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}

function allPageRows(){
  const rows = [];
  data.forEach(client => client.accounts.forEach(acct => {
    if(acct.webinarPage.url || acct.webinarThankYou.url){
      rows.push({ client, acct, kind:'webinar', label:'Webinar',
        cols:[ {key:'webinarPage', title:'Webinar Page'}, {key:'webinarThankYou', title:'Webinar Thank You Page'} ] });
    }
    if(acct.silverThankYou.url){
      rows.push({ client, acct, kind:'silver', label:'Silver',
        cols:[ {key:'silverThankYou', title:'Silver Thank You Page'} ] });
    }
    acct.extraPages.forEach(p => rows.push({ client, acct, kind:'extra', extraId:p.id, label:p.type||'Other', page:p }));
  }));
  return rows;
}

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderSidebar(){
  const el = document.getElementById('sidebar');
  let html = `<div class="brand">Ad Account <span>Manager</span></div>`;
  html += `<div class="nav-section-label">Clients</div>`;
  data.forEach(client => {
    const active = currentView === client.id ? 'active' : '';
    html += `<div class="nav-item ${active}" data-view="${client.id}">${escapeHtml(client.name)}<span class="count">${client.accounts.length}</span></div>`;
  });
  html += `<div class="nav-item" id="addClientNav">+ Add client</div>`;
  html += `<div class="nav-section-label">Overview</div>`;
  const lpActive = currentView === 'landing' ? 'active' : '';
  html += `<div class="nav-item ${lpActive}" data-view="landing">Landing Pages<span class="count">${allPageRows().length}</span></div>`;
  const dashActive = currentView === 'dashboard' ? 'active' : '';
  html += `<div class="nav-item ${dashActive}" data-view="dashboard">Dashboard</div>`;
  el.innerHTML = html;

  el.querySelectorAll('[data-view]').forEach(elm => {
    elm.addEventListener('click', () => { currentView = elm.getAttribute('data-view'); renderAll(); });
  });
  document.getElementById('addClientNav').addEventListener('click', () => {
    const c = { id: uid(), name: 'New Client', accounts: [ mkAccount({}) ] };
    data.push(c); currentView = c.id; save(); renderAll();
  });
}

function renderStatsBar(){
  let total = 0, checked = 0, high = 0, needsAttn = 0;
  data.forEach(c => c.accounts.forEach(a => {
    total++;
    if(a.tracking.checked === 'Yes') checked++;
    if(a.tracking.priority === 'High') high++;
    if(a.tracking.status === 'Needs Attention') needsAttn++;
  }));
  return `
    <div class="stats">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Accounts</div></div>
      <div class="stat"><div class="num">${checked}/${total}</div><div class="lbl">Checked</div></div>
      <div class="stat"><div class="num">${high}</div><div class="lbl">High priority</div></div>
      <div class="stat"><div class="num">${needsAttn}</div><div class="lbl">Needs attention</div></div>
    </div>`;
}

function renderMain(){
  const el = document.getElementById('main');
  if(currentView === 'landing'){ renderLandingPagesView(el); renderModal(); return; }
  if(currentView === 'dashboard'){ renderDashboardView(el); return; }
  const client = data.find(c => c.id === currentView);
  if(!client){ currentView = 'dashboard'; renderMain(); return; }

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1><input class="acct-name-input" style="font-size:22px;padding:2px 4px;" value="${escapeHtml(client.name)}" data-client-name="${client.id}" /></h1>
        <p>Account Setup + Pages + Events + Tracking for this client.</p>
      </div>
      ${renderStatsBar()}
    </div>
    <div class="toolbar">
      <button class="btn danger" id="delClientBtn">Remove client</button>
    </div>
    <div id="accountsWrap"></div>
    <button class="add-acct-btn" id="addAcctBtn">+ Add account for ${escapeHtml(client.name)}</button>
  `;

  const wrap = document.getElementById('accountsWrap');
  client.accounts.forEach(acct => wrap.appendChild(renderAccountCard(client, acct)));

  document.getElementById('addAcctBtn').addEventListener('click', () => {
    client.accounts.push(mkAccount({ name: 'New Account' }));
    save(); renderMain();
  });
  document.getElementById('delClientBtn').addEventListener('click', () => {
    if(confirm('Remove this client and all their accounts?')){
      data = data.filter(c => c.id !== client.id);
      currentView = data[0] ? data[0].id : 'dashboard';
      save(); renderAll();
    }
  });
  el.querySelector('[data-client-name]').addEventListener('input', (e) => {
    client.name = e.target.value; save(); renderSidebar();
  });
}

function renderAccountCard(client, acct){
  const card = document.createElement('div');
  card.className = 'acct-card';

  const head = document.createElement('div');
  head.className = 'acct-head';
  head.innerHTML = `
    <input class="acct-name-input" value="${escapeHtml(acct.name)}" placeholder="Account name" data-field="name" />
    <span class="pill pri-${acct.tracking.priority}">${acct.tracking.priority || 'No priority'}</span>
    <div style="flex:1"></div>
    <button class="icon-btn del" data-del-acct="1">Remove account</button>
  `;
  head.querySelector('[data-field=name]').addEventListener('input', e => { acct.name = e.target.value; save(); });
  head.querySelector('[data-del-acct]').addEventListener('click', () => {
    if(confirm('Remove this account?')){
      client.accounts = client.accounts.filter(a => a.id !== acct.id);
      save(); renderMain();
    }
  });
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'acct-body';

  // --- Setup column ---
  const setupCol = document.createElement('div');
  setupCol.innerHTML = `<div class="section-label">Account Setup</div>`;
  const setupGrid = document.createElement('div');
  setupGrid.className = 'field-grid';
  setupGrid.appendChild(textField('Ad Account ID', acct.acctId, v => { acct.acctId = v; save(); }));
  setupGrid.appendChild(textField('Pixel ID', acct.pixelId, v => { acct.pixelId = v; save(); }));

  const tokenField = document.createElement('div');
  tokenField.className = 'field';
  tokenField.innerHTML = `<label>Access Token</label>`;
  const tokenRow = document.createElement('div');
  tokenRow.className = 'token-row';
  const tokenInput = document.createElement('input');
  tokenInput.type = 'password';
  tokenInput.value = acct.accessToken;
  tokenInput.addEventListener('input', e => { acct.accessToken = e.target.value; save(); });
  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'icon-btn'; toggleBtn.textContent = 'Show'; toggleBtn.type = 'button';
  toggleBtn.addEventListener('click', () => {
    tokenInput.type = tokenInput.type === 'password' ? 'text' : 'password';
    toggleBtn.textContent = tokenInput.type === 'password' ? 'Show' : 'Hide';
  });
  tokenRow.appendChild(tokenInput); tokenRow.appendChild(toggleBtn);
  tokenField.appendChild(tokenRow);
  setupGrid.appendChild(tokenField);

  setupGrid.appendChild(textField('Audience Exclusion', acct.audienceExclusion, v => { acct.audienceExclusion = v; save(); }));
  setupGrid.appendChild(textField('Video ADS', acct.videoAds, v => { acct.videoAds = v; save(); }));
  setupGrid.appendChild(textField('Image ADS', acct.imageAds, v => { acct.imageAds = v; save(); }));
  setupGrid.appendChild(textField('Ads From Client', acct.adsFromClient, v => { acct.adsFromClient = v; save(); }));
  setupCol.appendChild(setupGrid);

  // Pages: fixed 3-column block
  const pagesLabel = document.createElement('div');
  pagesLabel.className = 'section-label';
  pagesLabel.textContent = 'Pages';
  setupCol.appendChild(pagesLabel);
  setupCol.appendChild(renderPages3(acct));

  // Extra pages (anything beyond the 3 fixed ones)
  const extraLabel = document.createElement('div');
  extraLabel.className = 'section-label';
  extraLabel.textContent = 'Other Pages';
  setupCol.appendChild(extraLabel);
  setupCol.appendChild(renderExtraPagesTable(acct));

  // --- Tracking + Events column ---
  const trackCol = document.createElement('div');
  trackCol.innerHTML = `<div class="section-label">Tracking</div>`;
  const trackGrid = document.createElement('div');
  trackGrid.className = 'field-grid';
  trackGrid.appendChild(selectField('Priority', ['','High','Medium','Low'], acct.tracking.priority, v => { acct.tracking.priority = v; save(); renderMain(); }));
  trackGrid.appendChild(selectField('Checked?', ['Yes','No'], acct.tracking.checked, v => { acct.tracking.checked = v; save(); }));
  trackGrid.appendChild(dateField('Date Checked', acct.tracking.dateChecked, v => { acct.tracking.dateChecked = v; save(); }));
  trackGrid.appendChild(textareaField('Optimization Done', acct.tracking.optimization, v => { acct.tracking.optimization = v; save(); }));
  trackGrid.appendChild(selectField('Current Status', ['Active - Improving','Active - Stable','Needs Attention','Paused','Disabled/Restricted'], acct.tracking.status, v => { acct.tracking.status = v; save(); }));
  trackGrid.appendChild(textareaField('Update / Action Needed', acct.tracking.update, v => { acct.tracking.update = v; save(); }));
  trackGrid.appendChild(textareaField('Remarks', acct.tracking.remarks, v => { acct.tracking.remarks = v; save(); }));
  trackCol.appendChild(trackGrid);

  const eventsLabel = document.createElement('div');
  eventsLabel.className = 'section-label';
  eventsLabel.textContent = 'Events';
  trackCol.appendChild(eventsLabel);
  trackCol.appendChild(renderEventsTable(acct));

  body.appendChild(setupCol);
  body.appendChild(trackCol);
  card.appendChild(body);
  return card;
}

function renderPages3(acct){
  const wrap = document.createElement('div');
  wrap.className = 'pages3';
  const defs = [
    { key:'webinarPage', title:'Webinar Page' },
    { key:'webinarThankYou', title:'Webinar Thank You Page' },
    { key:'silverThankYou', title:'Silver Thank You Page' }
  ];
  defs.forEach(d => {
    const col = document.createElement('div');
    col.className = 'page-col';
    const title = document.createElement('div');
    title.className = 'pc-title';
    title.textContent = d.title;
    const input = document.createElement('input');
    input.type = 'text'; input.placeholder = 'URL';
    input.value = acct[d.key].url;
    input.addEventListener('input', e => { acct[d.key].url = e.target.value; save(); renderSidebar(); });
    const isActive = acct[d.key].status === 'Active';
    const btn = document.createElement('button');
    btn.className = 'status-badge ' + (isActive ? 'status-Active' : 'status-Inactive');
    btn.textContent = isActive ? 'Active' : 'Inactive';
    btn.addEventListener('click', () => { acct[d.key].status = isActive ? 'Inactive' : 'Active'; save(); renderMain(); });
    col.appendChild(title); col.appendChild(input); col.appendChild(btn);
    wrap.appendChild(col);
  });
  return wrap;
}

function renderExtraPagesTable(acct){
  const container = document.createElement('div');
  const wrap = document.createElement('table');
  wrap.className = 'extra-table';
  wrap.innerHTML = `<thead><tr><th style="width:20%">Type</th><th style="width:32%">Page</th><th style="width:32%">Thank You Page</th><th style="width:12%">Status</th><th></th></tr></thead><tbody></tbody>`;
  const tbody = wrap.querySelector('tbody');

  acct.extraPages.forEach(p => {
    const tr = document.createElement('tr');
    tr.appendChild(cellInput(p, 'type', 'e.g. Multiple Question'));
    tr.appendChild(cellInput(p, 'page', 'Page URL'));
    tr.appendChild(cellInput(p, 'thankYou', 'Thank you URL'));
    const statusTd = document.createElement('td');
    const isActive = p.status === 'Active';
    const btn = document.createElement('button');
    btn.className = 'status-badge ' + (isActive ? 'status-Active' : 'status-Inactive');
    btn.textContent = isActive ? 'Active' : 'Inactive';
    btn.addEventListener('click', () => { p.status = isActive ? 'Inactive' : 'Active'; save(); renderMain(); });
    statusTd.appendChild(btn);
    tr.appendChild(statusTd);
    const delTd = document.createElement('td');
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del'; delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => { acct.extraPages = acct.extraPages.filter(x => x.id !== p.id); save(); renderMain(); });
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'icon-btn'; addBtn.style.marginTop = '6px';
  addBtn.textContent = '+ Add page';
  addBtn.addEventListener('click', () => {
    acct.extraPages.push({ id: uid(), type: '', page: '', thankYou: '', status: 'Inactive' });
    save(); renderMain();
  });

  container.appendChild(wrap);
  container.appendChild(addBtn);
  return container;

  function cellInput(obj, key, placeholder){
    const td = document.createElement('td');
    const input = document.createElement('input');
    input.type = 'text'; input.value = obj[key] || ''; input.placeholder = placeholder;
    input.addEventListener('input', e => { obj[key] = e.target.value; save(); });
    td.appendChild(input);
    return td;
  }
}

function renderEventsTable(acct){
  const table = document.createElement('table');
  table.className = 'events-table';
  const tbody = document.createElement('tbody');
  acct.events.forEach(ev => {
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.textContent = ev.name;
    const statusTd = document.createElement('td');
    const isActive = ev.status === 'Active';
    const btn = document.createElement('button');
    btn.className = 'status-badge ' + (isActive ? 'status-Active' : 'status-Inactive');
    btn.textContent = isActive ? 'Active' : 'Inactive';
    btn.addEventListener('click', () => { ev.status = isActive ? 'Inactive' : 'Active'; save(); renderMain(); });
    statusTd.appendChild(btn);
    tr.appendChild(nameTd); tr.appendChild(statusTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function textField(label, value, onChange){
  const f = document.createElement('div'); f.className = 'field';
  f.innerHTML = `<label>${label}</label>`;
  const input = document.createElement('input'); input.type = 'text'; input.value = value || '';
  input.addEventListener('input', e => onChange(e.target.value));
  f.appendChild(input);
  return f;
}
function textareaField(label, value, onChange){
  const f = document.createElement('div'); f.className = 'field';
  f.innerHTML = `<label>${label}</label>`;
  const ta = document.createElement('textarea'); ta.value = value || '';
  ta.addEventListener('input', e => onChange(e.target.value));
  f.appendChild(ta);
  return f;
}
function dateField(label, value, onChange){
  const f = document.createElement('div'); f.className = 'field';
  f.innerHTML = `<label>${label}</label>`;
  const input = document.createElement('input'); input.type = 'date'; input.value = value || '';
  input.addEventListener('input', e => onChange(e.target.value));
  f.appendChild(input);
  return f;
}
function selectField(label, options, value, onChange){
  const f = document.createElement('div'); f.className = 'field';
  f.innerHTML = `<label>${label}</label>`;
  const sel = document.createElement('select');
  options.forEach(opt => {
    const o = document.createElement('option'); o.value = opt; o.textContent = opt || '—';
    if(opt === value) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', e => onChange(e.target.value));
  f.appendChild(sel);
  return f;
}

function renderLandingPagesView(el){
  const rows = allPageRows();
  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1>Landing Pages</h1>
        <p>Every page across all clients. Toggling status here updates the same account's card too.</p>
      </div>
      <button class="btn primary" id="openAddPageBtn">+ Add page</button>
    </div>
    <div class="table-scroll">
    <table class="lp-table">
      <thead><tr><th>Client</th><th>Account</th><th>Account ID</th><th>Type</th><th>Page</th><th>Thank You Page</th><th>Status</th><th></th></tr></thead>
      <tbody id="lpBody"></tbody>
    </table>
    </div>
  `;
  document.getElementById('openAddPageBtn').addEventListener('click', () => {
    addPageModal = { clientId: data[0] ? data[0].id : null };
    renderModal();
  });

  const body = document.getElementById('lpBody');
  if(rows.length === 0){
    body.innerHTML = `<tr><td colspan="8" style="color:var(--muted);padding:16px;">No pages yet. Click "+ Add page" above.</td></tr>`;
    return;
  }
  rows.forEach(row => {
    const tr = document.createElement('tr');
    const tdClient = document.createElement('td'); tdClient.textContent = row.client.name;
    const tdAcct = document.createElement('td'); tdAcct.textContent = row.acct.name || '—';
    const tdId = document.createElement('td'); tdId.textContent = row.acct.acctId || '—';
    const tdType = document.createElement('td');
    const tdPage = document.createElement('td');
    const tdTY = document.createElement('td');
    const tdStatus = document.createElement('td');
    const tdDel = document.createElement('td');

    let statusRef, label;
    if(row.kind === 'webinar'){
      label = 'Webinar';
      tdPage.textContent = row.acct.webinarPage.url || '—';
      tdTY.textContent = row.acct.webinarThankYou.url || '—';
      statusRef = row.acct.webinarPage; // drive the shared status off webinarPage
    } else if(row.kind === 'silver'){
      label = 'Silver';
      tdPage.textContent = '—';
      tdTY.textContent = row.acct.silverThankYou.url || '—';
      statusRef = row.acct.silverThankYou;
    } else {
      label = row.page.type || 'Other';
      tdPage.textContent = row.page.page || '—';
      tdTY.textContent = row.page.thankYou || '—';
      statusRef = row.page;
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn del'; delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => {
        row.acct.extraPages = row.acct.extraPages.filter(x => x.id !== row.extraId);
        save(); renderMain();
      });
      tdDel.appendChild(delBtn);
    }
    tdType.textContent = label;
    const isActive = statusRef.status === 'Active';
    const btn = document.createElement('button');
    btn.className = 'status-badge ' + (isActive ? 'status-Active' : 'status-Inactive');
    btn.textContent = isActive ? 'Active' : 'Inactive';
    btn.addEventListener('click', () => { statusRef.status = isActive ? 'Inactive' : 'Active'; save(); renderMain(); });
    tdStatus.appendChild(btn);

    tr.append(tdClient, tdAcct, tdId, tdType, tdPage, tdTY, tdStatus, tdDel);
    body.appendChild(tr);
  });
}

function renderModal(){
  const existing = document.getElementById('modalBackdrop');
  if(existing) existing.remove();
  if(!addPageModal) return;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';

  const client = data.find(c => c.id === addPageModal.clientId) || data[0];
  const account = client ? (client.accounts.find(a => a.id === addPageModal.accountId) || client.accounts[0]) : null;

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h3>Add a page</h3>
    <div class="field"><label>Client</label><select id="mClient"></select></div>
    <div class="field"><label>Account</label><select id="mAccount"></select></div>
    <div class="field"><label>Page type</label><input type="text" id="mType" placeholder="e.g. Multiple Question" /></div>
    <div class="field"><label>Page URL</label><input type="text" id="mPage" placeholder="Page URL" /></div>
    <div class="field"><label>Thank You Page URL</label><input type="text" id="mThankYou" placeholder="Thank you URL" /></div>
    <div class="modal-actions">
      <button class="btn" id="mCancel">Cancel</button>
      <button class="btn primary" id="mSave">Add</button>
    </div>
  `;
  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  const clientSel = modal.querySelector('#mClient');
  data.forEach(c => {
    const o = document.createElement('option'); o.value = c.id; o.textContent = c.name;
    if(client && c.id === client.id) o.selected = true;
    clientSel.appendChild(o);
  });
  function fillAccounts(clientId){
    const c = data.find(x => x.id === clientId);
    const accSel = modal.querySelector('#mAccount');
    accSel.innerHTML = '';
    (c ? c.accounts : []).forEach(a => {
      const o = document.createElement('option'); o.value = a.id; o.textContent = a.name || '(unnamed account)';
      accSel.appendChild(o);
    });
  }
  fillAccounts(clientSel.value);
  clientSel.addEventListener('change', () => fillAccounts(clientSel.value));

  modal.querySelector('#mCancel').addEventListener('click', () => { addPageModal = null; renderModal(); });
  modal.querySelector('#mSave').addEventListener('click', () => {
    const c = data.find(x => x.id === clientSel.value);
    const accSel = modal.querySelector('#mAccount');
    const a = c && c.accounts.find(x => x.id === accSel.value);
    if(!a){ addPageModal = null; renderModal(); return; }
    a.extraPages.push({
      id: uid(),
      type: modal.querySelector('#mType').value,
      page: modal.querySelector('#mPage').value,
      thankYou: modal.querySelector('#mThankYou').value,
      status: 'Inactive'
    });
    save();
    addPageModal = null;
    renderAll();
  });
}

function maskCell(value){
  const wrap = document.createElement('div');
  wrap.className = 'mask-cell';
  const span = document.createElement('span');
  span.textContent = value ? '••••••••' : '—';
  const btn = document.createElement('button');
  btn.className = 'icon-btn sm'; btn.textContent = 'Show';
  let shown = false;
  btn.addEventListener('click', () => {
    shown = !shown;
    span.textContent = shown ? (value || '—') : (value ? '••••••••' : '—');
    btn.textContent = shown ? 'Hide' : 'Show';
  });
  wrap.appendChild(span); wrap.appendChild(btn);
  return wrap;
}

function csvEscape(v){
  const s = (v === undefined || v === null) ? '' : String(v);
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportDashboardCsv(includeTokens){
  const headers = ['Client Name','Account Name','Account ID','Pixel ID','Webinar Page','Thank You Page','Silver Page','Access Token','Event Fire'];
  const rows = [headers];
  data.forEach(client => {
    client.accounts.forEach(acct => {
      const activeEvents = acct.events.filter(e => e.status === 'Active').map(e => e.name);
      rows.push([
        client.name,
        acct.name || '',
        acct.acctId || '',
        acct.pixelId || '',
        acct.webinarPage.url || '',
        acct.webinarThankYou.url || '',
        acct.silverThankYou.url || '',
        includeTokens ? (acct.accessToken || '') : (acct.accessToken ? '(hidden)' : ''),
        activeEvents.length ? activeEvents.join('; ') : 'None'
      ]);
    });
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ad-account-dashboard.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderAll(){
  renderSidebar();
  renderMain();
}

renderAll();
